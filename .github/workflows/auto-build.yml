name: Check
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: make setup

      - name: Check
        run: make check
