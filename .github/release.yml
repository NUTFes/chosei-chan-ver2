changelog:
  exclude:
    # リリースノートから除外したいユーザー
    authors:
      - github-actions
  categories:
    - title: New Features 🎉
      labels:
        - 'enhancement'
    - title: Bug Fix 💊
      labels:
        - 'bug'
    - title: Documentation 📝
      labels:
        - 'documentation'
    - title: Other Changes 🛠
      labels:
        - '*'
